<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UserProfile</title>
    <link rel="stylesheet" href="../CSS/userprofile.css">
</head>
<body>
    <header>
        <div class="headContainer">
            <div class="navbar">
                <span id="menu">...</span>
                <a href="index.html"><span id="closebtn" style="color: black;">Back</span></a>
            </div>
            <div class="welcome">
                <span class="greetings">
                    <h2>Welcome Username !</h2>
                    <h4>To your Profile</h4>
                </span>
                <div class="profileimg">
                     <img src="photo Kalyani .pdf" alt="profile pic">
                </div>
            </div>
        </div>

        <div class="popupoverlay" id="pop">
         <div class="card">
            <div id="back" style="cursor: pointer;">>></div>
            <div class="menucard">
                   <p>Home</p>
                   <p>Edit details</p> 
                   <p>Change Profile pic</p> 
                   <p>Renew Account</p>
                   <p>Logout</p>
            </div>
         </div>
        </div>
    </header>

    <main>
        <div class="maincontainer">
            <div class="details">
                <h3 style="font-size:25px;">Details</h3>
            <br>
            <div class="info">
                <p>Username:</p>
                <p>Full Name:</p>
                <p>Email:</p>
                <p>Highest Class:</p>
                <p>Career Goal:</p>
                <p>University Name:</p>
                <p> CGPA:</p>
                <p>Uploaded Resume:</p>
            </div></div>
        </div>
    </main>

    <script src="../javascript/userprofile.js"></script>
    
</body>
</html>
